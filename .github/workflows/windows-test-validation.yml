name: GridShift Windows test validation

on:
  push:
    branches:
      - test/v0.2-windows-validation-rev3-20261003

permissions:
  contents: read

concurrency:
  group: gridshift-windows-test-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-validation:
    name: Windows x64 build, live UI, and installer smoke
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact test-branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.408
      - name: Verify toolchain, build, run actual UI, and install/uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $transcript = Join-Path $PWD 'artifacts\windows-validation.log'
          Start-Transcript -LiteralPath $transcript -Force | Out-Null
          try {
            Write-Output "RUN_URL=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            Write-Output "SOURCE_COMMIT=$env:GITHUB_SHA"
            Write-Output "RUNNER_OS=$env:RUNNER_OS RUNNER_ARCH=$env:RUNNER_ARCH"
            dotnet --info
            $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
            $nsisUrl = 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip'
            Invoke-WebRequest -Uri $nsisUrl -OutFile $archive
            $archiveItem = Get-Item -LiteralPath $archive
            if ($archiveItem.Length -ne 2363925) { throw "NSIS archive size mismatch: $($archiveItem.Length)." }
            $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($archiveHash -ne 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8') { throw 'NSIS archive SHA-256 mismatch.' }
            $nsisExtract = Join-Path $env:RUNNER_TEMP 'nsis-3.13-extracted'
            Expand-Archive -LiteralPath $archive -DestinationPath $nsisExtract -Force
            $makensis = Get-ChildItem -LiteralPath $nsisExtract -Filter makensis.exe -File -Recurse | Select-Object -First 1
            if (-not $makensis) { throw 'Pinned NSIS archive contains no makensis.exe.' }
            $nsisDirectory = $makensis.Directory.FullName
            while (-not (Test-Path (Join-Path $nsisDirectory 'Include\MUI2.nsh'))) {
              $parent = Split-Path -Parent $nsisDirectory
              if (-not $parent -or $parent -eq $nsisDirectory) { throw 'Could not locate pinned NSIS include root.' }
              $nsisDirectory = $parent
            }
            $env:NSISDIR = $nsisDirectory
            $env:PATH = "$nsisDirectory;$($makensis.Directory.FullName);$env:PATH"
            Write-Output "NSIS_ARCHIVE_BYTES=$($archiveItem.Length) NSIS_ARCHIVE_SHA256=$archiveHash"
            Write-Output "NSIS_VERSION=$(& makensis -VERSION) NSISDIR=$env:NSISDIR"
            & .\build-release.ps1
            if ($LASTEXITCODE -ne 0) { throw "build-release.ps1 failed with exit code $LASTEXITCODE." }
            & .\tests\InstallerSmoke.ps1
            if ($LASTEXITCODE -ne 0) { throw "InstallerSmoke.ps1 failed with exit code $LASTEXITCODE." }
            Write-Output "UI_HARNESS_RESULT=see actual WinForms UiChecks output above; check DeviceDpi and prompt-path PASS lines."
            Write-Output "INSTALLER_SHA256=$((Get-FileHash -LiteralPath 'artifacts\GridShift-0.2.0-x64-setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant())"
            Write-Output "INSTALLER_BYTES=$((Get-Item -LiteralPath 'artifacts\GridShift-0.2.0-x64-setup.exe').Length)"
            Write-Output 'DISPLAY_CAPABILITY=hosted Windows runner only; interactive-user DPI/theme/tray/game/real-desktop COM visual validation is not established by this job.'
          }
          finally {
            Stop-Transcript | Out-Null
          }
      - name: Preserve build, UI, install evidence, and installer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gridshift-windows-test-validation-${{ github.sha }}
          path: |
            artifacts/windows-validation.log
            artifacts/GridShift-0.2.0-x64-setup.exe
            artifacts/publish/runtime-inventory.txt
            artifacts/uninstall-manifest.nsh
          if-no-files-found: warn
          retention-days: 30
